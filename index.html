<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NIGHT PHONE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#05070a; color:#fff; font-family:-apple-system, "PingFang SC", sans-serif; }
  #lock {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    background:linear-gradient(160deg,#0d1117,#05070a);
  }
  .lock-icon { font-size:48px; color:#c9a96e; margin-bottom:20px; }
  .lock-title { font-size:22px; letter-spacing:6px; color:#c9a96e; margin-bottom:8px; }
  .lock-sub { font-size:12px; color:#666; letter-spacing:2px; margin-bottom:36px; }
  .lock-input {
    background:transparent; border:none; border-bottom:1px solid #333;
    color:#c9a96e; text-align:center; font-size:20px; letter-spacing:8px;
    padding:10px 0; width:220px; outline:none; margin-bottom:24px;
  }
  .lock-input:focus { border-color:#c9a96e; }
  .lock-btn {
    background:transparent; border:1px solid #c9a96e; color:#c9a96e;
    padding:12px 48px; font-size:14px; letter-spacing:6px; border-radius:4px;
  }
  .lock-err { color:#ff3b6b; font-size:12px; margin-top:16px; height:16px; }
  #home {
    display:none; position:fixed; inset:0; flex-direction:column;
    background:linear-gradient(180deg,#0d1117,#05070a);
    align-items:center; justify-content:center;
  }
  .home-title { font-size:26px; letter-spacing:8px; color:#c9a96e; margin-bottom:10px; }
  .home-sub { font-size:12px; color:#555; letter-spacing:2px; }
</style>
</head>
<body>

<div id="lock">
  <div class="lock-icon">⛧</div>
  <div class="lock-title">NIGHT PHONE</div>
  <div class="lock-sub">PRIVATE TERMINAL</div>
  <input type="password" class="lock-input" id="lock-pwd" placeholder="输入密码" autocomplete="off">
  <button class="lock-btn" onclick="unlock()">进 入</button>
  <div class="lock-err" id="lock-err"></div>
</div>

<div id="home">
  <div class="home-title">NIGHT PHONE</div>
  <div class="home-sub">已进入 · 主屏幕建设中</div>
</div>

<script>
  function unlock() {
    const v = document.getElementById('lock-pwd').value.trim();
    if (v === '1993') {
      document.getElementById('lock').style.display = 'none';
      document.getElementById('home').style.display = 'flex';
    } else {
      document.getElementById('lock-err').textContent = '>> 密码错误';
      document.getElementById('lock-pwd').value = '';
    }
  }
  document.getElementById('lock-pwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') unlock();
  });
</script>
</body>
</html>
